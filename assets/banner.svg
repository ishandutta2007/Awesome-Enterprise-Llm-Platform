<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Network Grid & Particles -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="140" r="4" fill="#818cf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="90" r="3.5" fill="#c084fc">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="310" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="320" r="3" fill="#818cf8">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Animated Data Flow Lines -->
    <path d="M 100 200 Q 300 100 600 200 T 1100 200" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 220 Q 300 320 600 220 T 1100 220" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Dynamic Pulsing Orbit Rings in Background -->
  <g transform="translate(600, 200)" opacity="0.2">
    <circle cx="0" cy="0" r="170" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="230" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="10 15">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Title and Subtitle Header Group -->
  <g text-anchor="middle" transform="translate(600, 160)">
    <!-- Main Title -->
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="url(#text-grad)" letter-spacing="1.5" filter="url(#glow)">
      Awesome Enterprise LLM Platform
    </text>
    
    <!-- Subtitle -->
    <text y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#94a3b8" letter-spacing="0.5">
      Curated Landscape of Managed LLM Inference, RAG Orchestration, Gateway &amp; Observability
    </text>
  </g>

  <!-- Category Badges / Pills Below Title -->
  <g transform="translate(600, 275)" text-anchor="middle">
    <!-- Pill 1: Managed Inference -->
    <g transform="translate(-330, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
      <text y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ Managed Serving</text>
    </g>

    <!-- Pill 2: RAG Orchestration -->
    <g transform="translate(-110, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" opacity="0.9"/>
      <text y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#818cf8">🧠 RAG Orchestration</text>
    </g>

    <!-- Pill 3: AI Gateway -->
    <g transform="translate(110, 0)">
      <rect x="-75" y="-18" width="150" height="36" rx="18" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" opacity="0.9"/>
      <text y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🌐 AI Gateway</text>
    </g>

    <!-- Pill 4: LLM Observability -->
    <g transform="translate(320, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#card-grad)" stroke="#f472b6" stroke-width="1.2" opacity="0.9"/>
      <text y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f472b6">📊 Observability</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <text x="600" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#64748b" letter-spacing="1">
    PRODUCTION-READY SAAS &amp; OPEN-SOURCE ECOSYSTEM
  </text>
</svg>
